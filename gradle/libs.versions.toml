[versions]
flyway = "11.5.0"
junit = "6.1.0"
kotlin = "2.3.21"
ktor = "3.5.0"
tbd-libs = "20260513.1819"
testcontainers = "2.0.5"

[libraries]
flyway-database-oracle = { module = "org.flywaydb:flyway-database-oracle", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = "com.zaxxer:HikariCP:7.0.2"
httpclient5-fluent = "org.apache.httpcomponents.client5:httpclient5-fluent:5.6.1"
kotliquery = "com.github.seratch:kotliquery:1.9.1"
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
logback-classic = "ch.qos.logback:logback-classic:1.5.32"
logback-logstash-encoder = "net.logstash.logback:logstash-logback-encoder:9.0"
postgresql = "org.postgresql:postgresql:42.7.11"
rapids-and-rivers = "com.github.navikt:rapids-and-rivers:2026051812441779101082"
ojdbc11 = "com.oracle.database.jdbc:ojdbc11:23.26.2.0.0"

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mock-oauth2-server = "no.nav.security:mock-oauth2-server:4.0.0"
mockk = "io.mockk:mockk:1.14.9"
tbd-libs-rapids-and-rivers-test = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbd-libs" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-oracle-free = { module = "org.testcontainers:testcontainers-oracle-free", version.ref = "testcontainers" }
wiremock = "org.wiremock:wiremock-jetty12:3.13.2"

[bundles]
ktor-server = [
    "ktor-server-auth",
    "ktor-server-auth-jwt",
    "ktor-server-call-id",
    "ktor-server-call-logging",
    "ktor-server-cio",
    "ktor-server-content-negotiation",
    "ktor-server-core",
    "ktor-serialization-jackson",
    "ktor-server-metrics-micrometer"
]
logback = [
    "logback-classic",
    "logback-logstash-encoder"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = "org.jlleitschuh.gradle.ktlint:14.2.0"
