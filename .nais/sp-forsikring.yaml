apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sp-forsikring
  namespace: tbd
  labels:
    team: tbd
spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        diskAutoresize: true
        tier: {{ db.tier }}
        name: sp-forsikring
        databases:
          - name: sp-forsikring
            envVarPrefix: DATABASE
{{#if db.extraUsers}}
            users:
{{#each db.extraUsers as |extraUser|}}
              - name: {{ extraUser }}
{{/each}}
{{/if}}
        flags:
          - name: cloudsql.enable_pgaudit
            value: "{{db.pgAudit}}"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  port: 8080
  startup:
    path: isready
    initialDelay: 20
    periodSeconds: 5
    failureThreshold: 9
  liveness:
    path: isalive
  readiness:
    path: isready
  preStopHook:
    http:
      path: /stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
        - id: team_logs
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  replicas:
    min: 2
    max: 2
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
  kafka:
    pool: {{ kafkaPool }}
  azure:
    application:
      enabled: true
      allowAllUsers: true
  prometheus:
    enabled: true
    path: /metrics
  envFrom:
    # Secreten avgjøres per miljø. Nøklene i den mappes til REPLIKABASE_*-variablene under,
    # slik at appen ser samme variabelnavn uansett hvilken base den snakker med.
    - secret: {{ replikabase.secret }}
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-sp-forsikring-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: REPLIKABASE_JDBC_URL
      # Trippel-krøllparentes for å unngå at handlebars HTML-escaper & i URL-en
      value: {{{ replikabase.jdbcUrl }}}
    - name: REPLIKABASE_USERNAME
      value: {{ replikabase.username }}
    - name: REPLIKABASE_PASSWORD
      value: {{ replikabase.passord }}
    - name: REPLIKABASE_SCHEMA
      value: {{ replikabase.schema }}
    - name: GOSYS_BASE_URL
      value: {{ gosys.baseurl }}
    - name: GOSYS_SCOPE
      value: {{ gosys.scope }}
  accessPolicy:
    inbound:
      rules:
        - application: spesialist
          namespace: tbd
        - application: spre-gosys
          namespace: tbd
        - application: sporbar
          namespace: tbd
        - application: speil
          namespace: tbd
        - application: sp-forsikring-statistikk
          namespace: tbd
        - application: flex-sykmeldinger-backend
          namespace: flex
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: {{ gosys.externalAddress }}
