spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        diskAutoresize: true
        tier: db-custom-1-3840
        name: sp-forsikring
        databases:
          - name: sp-forsikring
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  kafka:
    pool: nav-prod
  # Nøklene i secreten mappes til REPLIKABASE_*-variablene under,
  # slik at appen ser samme variabelnavn uansett hvilken base den snakker med.
  envFrom:
    - secret: sp-forsikring-oracle
  env:
    - name: DB_MAX_POOL_SIZE
      value: "10"
    - name: REPLIKABASE_JDBC_URL
      value: $(ORACLE_URL)
    - name: REPLIKABASE_USERNAME
      value: $(ORACLE_USERNAME)
    - name: REPLIKABASE_PASSWORD
      value: $(ORACLE_PASSWORD)
    - name: REPLIKABASE_SCHEMA
      value: $(ORACLE_DATABASE)
    - name: GOSYS_BASE_URL
      value: https://oppgave.prod-fss-pub.nais.io
    - name: GOSYS_SCOPE
      value: api://prod-fss.oppgavehandtering.oppgave/.default
    - name: TILGANGSMASKINEN_SCOPE
      value: api://prod-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default
  accessPolicy:
    outbound:
      external:
        - host: oppgave.prod-fss-pub.nais.io
