apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sp-forsikring-spleis-testdata-replikabase-policy
  namespace: tbd
spec:
  egress:
    # Public IP-en til Cloud SQL-instansen forsikring-replika-testdata, som spleis-testdata eier.
    # Slås opp med: kubectl get sqlinstance forsikring-replika-testdata -n tbd -o jsonpath='{.status.publicIpAddress}'
    - to:
        - ipBlock:
            cidr: 34.88.135.117/32
  podSelector:
    matchLabels:
      app: sp-forsikring
  policyTypes:
    - Egress
