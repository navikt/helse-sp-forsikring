name: Build

on:
  workflow_call:
    inputs:
      push_image:
        description: 'Om bygget image skal pushes eller ikke'
        type: boolean
        default: true
        required: false
      gradle_project:
        description: 'Gradle-prosjektet som skal bygges'
        type: string
        default: ':sp-forsikring'
        required: false
      docker_target:
        description: 'Target stage i Dockerfile'
        type: string
        default: 'sp-forsikring'
        required: false
      image_suffix:
        description: 'Suffix for Docker-image'
        type: string
        default: ''
        required: false
    outputs:
      image:
        description: "Navn på imaget som ble bygget"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      packages: read
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Fetch all history for what-changed action

      - name: Determine what to do
        id: changed-files
        uses: "nais/what-changed@main"
        with:
          files: '.nais/*'

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
      - name: gradle build installDist
        run: ./gradlew ${{ inputs.gradle_project }}:build ${{ inputs.gradle_project }}:installDist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image and SBOM to OCI registry
        if: steps.changed-files.outputs.changed != 'only-inputs'
        uses: nais/docker-build-push@05dbb6091b30bd84279c6d64a45ef8782fd410a5 # v0
        id: docker-build-push
        with:
          team: tbd
          push_image: ${{ inputs.push_image }}
          dockerfile: Dockerfile
          docker_context: .
          image_suffix: ${{ inputs.image_suffix }}
          target: ${{ inputs.docker_target }}
