name: Bygg og deploy main

on:
  push:
    branches:
      - main
    paths:
      - 'sp-forsikring/**'
      - 'migreringer/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/build.yml'
      - '.nais/sp-forsikring.yaml'
      - '.nais/sp-forsikring-vars-dev.yaml'
      - '.nais/sp-forsikring-vars-prod.yaml'
      - 'Dockerfile'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradle/**'
  schedule:
    - cron: '0 4 * * 3'
      timezone: 'Europe/Oslo'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deployDev:
    name: Deploy to dev
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: nais/deploy/actions/deploy@5fdd91aaf69bb0d6dd5e5118cdacb639f487b93b # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/sp-forsikring.yaml
          VARS: .nais/sp-forsikring-vars-dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}

  deployProd:
    name: Deploy to prod
    needs: [ build, deployDev ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: nais/deploy/actions/deploy@5fdd91aaf69bb0d6dd5e5118cdacb639f487b93b # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/sp-forsikring.yaml
          VARS: .nais/sp-forsikring-vars-prod.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
