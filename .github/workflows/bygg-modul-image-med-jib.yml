name: Bygg image

on:
  workflow_call:
    inputs:
      modul:
        description: 'Modulen som skal bli til et image'
        required: true
        type: string
    outputs:
      image_ref:
        description: 'Referanse til det bygde imaget'
        value: ${{ jobs.bygg-image.outputs.image_ref }}

jobs:
  bygg-image:
    name: Bygg image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # for sarif upload on private repos
      contents: read
      id-token: write # for nais login
      security-events: write # push sarif to github security
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: 25

    - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: NAIS login
      id: login
      uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
      with:
        team: tbd

    - name: gradlew :${{ inputs.modul }}:jib
      id: jib
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./gradlew :${{ inputs.modul }}:jib --build-cache \
          -Pimage.registry='${{ steps.login.outputs.registry }}' \
          -Pimage.tag=$(date -u +%Y.%m.%d-%H.%M)-$(git rev-parse --short=12 HEAD) \
          -Djib.console=plain
        ref="$(cat '${{ inputs.modul }}/build/jib-image.name')@$(cat '${{ inputs.modul }}/build/jib-image.digest')"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Generer SBOM, attester og signer
      uses: nais/attest-sign@bb00e4baa4e7acd00b6aff2502b2dfed3d4fad40 # v2.0.14
      with:
        image_ref: ${{ steps.jib.outputs.ref }}

    - name: Scan docker image for secrets
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.jib.outputs.ref }}
        format: 'sarif'
        scanners: 'secret'
        output: 'trivy.sarif'

    - uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: 'trivy.sarif'
    outputs:
      image_ref: ${{ steps.jib.outputs.ref }}
